<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동체 시력 테스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f1a;
      --surface: #161829;
      --border: #252840;
      --text: #e8eaf6;
      --muted: #6b7280;
      --accent: #6c63ff;
      --green: #22d3a4;
      --yellow: #fbbf24;
      --red: #f87171;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .screen { display: none; width: 100%; max-width: 560px; text-align: center; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* START */
    .logo { font-size: 3.5rem; margin-bottom: 8px; }
    h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { color: var(--muted); margin: 8px 0 28px; font-size: 0.95rem; line-height: 1.6; }

    .how-to {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 28px;
      text-align: left;
      width: 100%;
    }
    .how-to h3 { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .how-to li { font-size: 0.9rem; color: var(--text); margin-bottom: 8px; list-style: none; }
    .how-to li::before { content: '→ '; color: var(--accent); }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 40px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, background 0.12s;
    }
    .btn:hover { background: #574fd6; transform: scale(1.03); }
    .btn:active { transform: scale(0.97); }
    .btn.secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 12px;
    }
    .btn.secondary:hover { background: var(--border); }

    /* GAME */
    #screen-game { max-width: 100%; padding: 0; }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .hud-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      min-width: 80px;
    }
    .hud-box .val { font-size: 1.2rem; font-weight: 700; color: var(--text); display: block; }

    .stage-label { font-size: 0.9rem; color: var(--accent); font-weight: 700; }

    .speed-bar-wrap {
      width: 100%; max-width: 720px;
      margin: 0 auto;
      padding: 6px 24px 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .speed-label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
    .speed-bar-bg { flex: 1; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .speed-bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
      transition: width 0.4s ease;
    }

    #arena {
      position: relative;
      width: 100%; max-width: 720px;
      margin: 0 auto;
      height: 200px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    #ball {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; font-weight: 900; color: #fff;
      will-change: left;
      user-select: none;
    }

    .flash-overlay {
      position: absolute; inset: 0;
      pointer-events: none; opacity: 0;
    }
    .flash-overlay.show { animation: flashAnim 0.25s ease; }
    @keyframes flashAnim { 0%{opacity:0.18} 100%{opacity:0} }

    .answer-area {
      width: 100%; max-width: 720px;
      margin: 0 auto;
      padding: 20px 24px;
    }

    .question-text {
      font-size: 0.95rem; color: var(--muted); margin-bottom: 14px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .choice-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px 8px;
      font-size: 1.5rem; font-weight: 800;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, transform 0.1s;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--accent); background: #1e2038; transform: scale(1.05); }
    .choice-btn.correct { border-color: var(--green); background: rgba(34,211,164,0.12); color: var(--green); }
    .choice-btn.wrong   { border-color: var(--red);   background: rgba(248,113,113,0.12); color: var(--red); }
    .choice-btn:disabled { cursor: default; transform: none; }

    /* RESULT */
    .result-icon { font-size: 4rem; margin-bottom: 12px; }
    .result-grade { font-size: 2.4rem; font-weight: 900; margin-bottom: 4px; }
    .result-desc { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }

    .score-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; width: 100%; margin-bottom: 24px;
    }
    .score-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 10px; text-align: center;
    }
    .score-card .sc-val { font-size: 1.8rem; font-weight: 800; display: block; }
    .score-card .sc-label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    .round-log {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 24px; text-align: left;
      max-height: 220px; overflow-y: auto;
    }
    .round-log h3 { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .round-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .round-row:last-child { border-bottom: none; }
    .rr-num { color: var(--muted); width: 28px; }
    .rr-answer { flex: 1; }
    .rr-speed { color: var(--muted); font-size: 0.78rem; }

    /* COUNTDOWN */
    #countdown {
      position: fixed; inset: 0;
      background: rgba(13,15,26,0.96);
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 100;
    }
    #countdown .cd-num {
      font-size: 7rem; font-weight: 900; color: var(--accent);
      animation: popIn 0.35s ease;
    }
    @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
    #countdown p { font-size: 1rem; color: var(--muted); margin-top: 12px; }

    @media (max-width: 480px) {
      #ball { width: 58px; height: 58px; font-size: 1.3rem; }
      #arena { height: 160px; }
      .choice-btn { padding: 14px 4px; font-size: 1.2rem; }
      .game-header { padding: 12px 16px; }
      .answer-area { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<!-- START -->
<div id="screen-start" class="screen active">
  <div class="logo">👁️</div>
  <h1>동체 시력 테스트</h1>
  <p class="subtitle">빠르게 날아가는 공에 적힌 숫자를 읽어보세요.<br>10라운드, 단계마다 속도가 빨라집니다.</p>
  <div class="how-to">
    <h3>게임 방법</h3>
    <ul>
      <li>공이 화면을 가로질러 지나갑니다</li>
      <li>공에 적힌 숫자를 놓치지 마세요</li>
      <li>공이 사라진 뒤 아래 보기에서 정답을 고르세요</li>
      <li>정확도와 점수로 동체 시력 등급을 평가합니다</li>
    </ul>
  </div>
  <button class="btn" onclick="startCountdown()">테스트 시작</button>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div class="game-header">
    <div class="hud-box">
      <span class="val" id="hud-round">1 / 10</span>
      라운드
    </div>
    <div class="stage-label" id="hud-stage">LEVEL 1</div>
    <div class="hud-box">
      <span class="val" id="hud-score">0</span>
      점수
    </div>
  </div>

  <div class="speed-bar-wrap">
    <span class="speed-label">속도</span>
    <div class="speed-bar-bg">
      <div class="speed-bar-fill" id="speed-bar" style="width:10%"></div>
    </div>
  </div>

  <div id="arena">
    <div id="ball"></div>
    <div class="flash-overlay" id="flash"></div>
  </div>

  <div class="answer-area">
    <div class="question-text" id="question-text">공이 지나가는 동안 숫자를 읽으세요...</div>
    <div class="choices" id="choices"></div>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-grade" id="result-grade"></div>
  <div class="result-desc" id="result-desc"></div>

  <div class="score-grid">
    <div class="score-card">
      <span class="sc-val" id="res-correct" style="color:var(--green)"></span>
      <div class="sc-label">정답</div>
    </div>
    <div class="score-card">
      <span class="sc-val" id="res-wrong" style="color:var(--red)"></span>
      <div class="sc-label">오답</div>
    </div>
    <div class="score-card">
      <span class="sc-val" id="res-score" style="color:var(--accent)"></span>
      <div class="sc-label">점수</div>
    </div>
  </div>

  <div class="round-log" id="round-log"></div>

  <button class="btn" onclick="startCountdown()">다시 도전</button>
  <button class="btn secondary" onclick="showScreen('start')">처음으로</button>
</div>

<!-- COUNTDOWN -->
<div id="countdown">
  <div class="cd-num" id="cd-num">3</div>
  <p>화면 중앙을 바라보세요</p>
</div>

<script>
  const TOTAL = 10;
  const SPEEDS  = [1.4, 1.8, 2.2, 2.7, 3.2, 3.8, 4.5, 5.3, 6.2, 7.5];
  const LEVELS  = ['LEVEL 1','LEVEL 1','LEVEL 2','LEVEL 2','LEVEL 3','LEVEL 3','LEVEL 4','LEVEL 4','LEVEL 5','LEVEL 5'];
  const COLORS  = ['#6c63ff','#ff6584','#22d3a4','#fbbf24','#f97316','#38bdf8','#a78bfa','#fb923c','#e879f9','#4ade80'];

  let round, score, answer, answered, roundLog, animId;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
  }

  function startCountdown() {
    const el = document.getElementById('countdown');
    el.style.display = 'flex';
    let n = 3;
    tick();
    function tick() {
      const num = document.getElementById('cd-num');
      num.style.animation = 'none';
      num.offsetHeight; // reflow
      num.style.animation = 'popIn 0.35s ease';
      num.textContent = n > 0 ? n : 'GO!';
      if (n < 0) { el.style.display = 'none'; beginGame(); return; }
      n--;
      setTimeout(tick, 800);
    }
  }

  function beginGame() {
    round = 0; score = 0; roundLog = [];
    showScreen('game');
    nextRound();
  }

  function nextRound() {
    if (round >= TOTAL) { showResult(); return; }
    answered = false;

    const speed = SPEEDS[round];
    document.getElementById('hud-round').textContent = (round + 1) + ' / ' + TOTAL;
    document.getElementById('hud-stage').textContent = LEVELS[round];
    document.getElementById('hud-score').textContent = score;
    document.getElementById('speed-bar').style.width = (10 + round * 9) + '%';
    document.getElementById('question-text').textContent = '공이 지나가는 동안 숫자를 읽으세요...';
    document.getElementById('choices').innerHTML = '';

    // pick numbers
    answer = Math.floor(Math.random() * 9) + 1;
    const pool = new Set([answer]);
    while (pool.size < 4) pool.add(Math.floor(Math.random() * 9) + 1);
    const choices = shuffle([...pool]);

    // setup ball
    const arena = document.getElementById('arena');
    const ball  = document.getElementById('ball');
    const color = COLORS[round % COLORS.length];
    ball.style.background = color;
    ball.style.boxShadow  = `0 0 30px ${color}99`;
    ball.textContent = answer;
    ball.style.opacity = '1';

    const arenaW = arena.clientWidth;
    const ballD  = ball.offsetWidth || 72;
    let x = -ballD - 10;
    ball.style.left = x + 'px';

    let last = null;
    let hidden = false;

    function frame(ts) {
      if (!last) last = ts;
      x += speed * (ts - last);
      last = ts;
      ball.style.left = x + 'px';

      // hide digit once ball passes center-ish
      if (!hidden && x > arenaW * 0.38) {
        ball.textContent = '';
        hidden = true;
      }

      if (x < arenaW + ballD) {
        animId = requestAnimationFrame(frame);
      } else {
        ball.style.opacity = '0';
        document.getElementById('question-text').textContent = '공에 적힌 숫자는 무엇이었나요?';
        renderChoices(choices);
      }
    }
    animId = requestAnimationFrame(frame);
  }

  function renderChoices(choices) {
    const el = document.getElementById('choices');
    el.innerHTML = '';
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = c;
      btn.onclick = () => pick(c, btn);
      el.appendChild(btn);
    });
  }

  function pick(chosen, btn) {
    if (answered) return;
    answered = true;

    const correct = chosen === answer;
    const pts = correct ? Math.round(10 + SPEEDS[round] * 4) : 0;
    if (correct) score += pts;

    document.querySelectorAll('.choice-btn').forEach(b => {
      b.disabled = true;
      if (+b.textContent === answer) b.classList.add('correct');
      else if (b === btn && !correct) b.classList.add('wrong');
    });

    const flash = document.getElementById('flash');
    flash.style.background = correct ? 'var(--green)' : 'var(--red)';
    flash.classList.remove('show');
    flash.offsetHeight;
    flash.classList.add('show');

    roundLog.push({ r: round + 1, correct, answer, chosen, speed: SPEEDS[round] });
    round++;
    document.getElementById('hud-score').textContent = score;
    setTimeout(nextRound, 1000);
  }

  function showResult() {
    const correct = roundLog.filter(r => r.correct).length;
    const acc = Math.round(correct / TOTAL * 100);

    const grades = [
      { min:100, icon:'🏆', grade:'S급', color:'#fbbf24', desc:'완벽합니다! 타고난 동체 시력의 소유자입니다.' },
      { min: 90, icon:'🥇', grade:'A급', color:'#22d3a4', desc:'탁월한 동체 시력! 운동선수 수준입니다.' },
      { min: 70, icon:'🥈', grade:'B급', color:'#6c63ff', desc:'평균 이상의 좋은 동체 시력입니다.' },
      { min: 50, icon:'🥉', grade:'C급', color:'#f97316', desc:'보통 수준입니다. 꾸준히 연습해보세요!' },
      { min:  0, icon:'👀', grade:'D급', color:'#f87171', desc:'동체 시력이 약합니다. 훈련이 필요해요!' },
    ];
    const g = grades.find(g => acc >= g.min);

    document.getElementById('result-icon').textContent = g.icon;
    document.getElementById('result-grade').textContent = g.grade;
    document.getElementById('result-grade').style.color = g.color;
    document.getElementById('result-desc').textContent = g.desc;
    document.getElementById('res-correct').textContent = correct;
    document.getElementById('res-wrong').textContent = TOTAL - correct;
    document.getElementById('res-score').textContent = score;

    const log = document.getElementById('round-log');
    log.innerHTML = '<h3>라운드 기록</h3>' + roundLog.map(r => `
      <div class="round-row">
        <span class="rr-num">${r.r}.</span>
        <span>${r.correct ? '✅' : '❌'}</span>
        <span class="rr-answer">${r.correct ? '정답 ' + r.answer : '정답 ' + r.answer + ' · 선택 ' + r.chosen}</span>
        <span class="rr-speed">Lv.속도 ${r.speed.toFixed(1)}</span>
      </div>`).join('');

    showScreen('result');
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
</script>
</body>
</html>
