<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f8f9fb;
      --border: #e4e7ec;
      --text: #1a1d23;
      --text-muted: #6b7280;
      --accent: #4f63ff;
      --accent-hover: #3a4eeb;
      --danger: #ef4444;
      --done-text: #9ca3af;
      --done-line: #d1d5db;
      --tag-bg: #eef0ff;
      --tag-text: #4f63ff;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-card {
      flex: 1;
      min-width: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-card .num {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .input-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input[type="text"] {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      background: var(--surface2);
      color: var(--text);
    }

    .input-row input[type="text"]:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-add:hover { background: var(--accent-hover); }
    .btn-add:active { transform: scale(0.97); }

    .meta-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .meta-row select, .meta-row input[type="date"] {
      flex: 1;
      min-width: 120px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.85rem;
      outline: none;
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
    }

    .meta-row select:focus, .meta-row input[type="date"]:focus {
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
    }

    .filter-tabs button {
      border: none;
      background: none;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.83rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.12s, color 0.12s;
      font-weight: 500;
    }

    .filter-tabs button.active {
      background: var(--accent);
      color: #fff;
    }

    .sort-select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.83rem;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s, transform 0.2s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item.done {
      opacity: 0.65;
    }

    .checkbox-wrap {
      margin-top: 2px;
      flex-shrink: 0;
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .todo-content {
      flex: 1;
      min-width: 0;
    }

    .todo-text {
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--done-text);
    }

    .todo-meta {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .priority-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .priority-badge.high   { background: #fee2e2; color: #b91c1c; }
    .priority-badge.medium { background: #fef3c7; color: #92400e; }
    .priority-badge.low    { background: #dcfce7; color: #166534; }

    .due-badge {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .due-badge.overdue { color: var(--danger); font-weight: 600; }

    .todo-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: background 0.12s, color 0.12s;
      line-height: 1;
    }

    .btn-icon:hover { background: var(--surface2); color: var(--text); }
    .btn-icon.delete:hover { background: #fee2e2; color: var(--danger); border-color: #fca5a5; }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }

    .bulk-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .btn-bulk {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.12s;
    }

    .btn-bulk:hover { background: var(--surface2); color: var(--text); }
    .btn-bulk.danger:hover { background: #fee2e2; color: var(--danger); border-color: #fca5a5; }

    .progress-bar-wrap {
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    @media (max-width: 500px) {
      .stat-card .num { font-size: 1.3rem; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>✅ 할 일 관리</h1>
    <p id="today-label"></p>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="stat-total">0</div>
      <div class="label">전체</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-active">0</div>
      <div class="label">진행 중</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-done">0</div>
      <div class="label">완료</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-overdue">0</div>
      <div class="label">기한 초과</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <input type="text" id="new-task" placeholder="새 할 일을 입력하세요..." />
      <button class="btn-add" onclick="addTask()">추가</button>
    </div>
    <div class="meta-row">
      <select id="new-priority">
        <option value="medium">보통 우선순위</option>
        <option value="high">높은 우선순위</option>
        <option value="low">낮은 우선순위</option>
      </select>
      <input type="date" id="new-due" title="마감일" />
    </div>
  </div>

  <div class="controls">
    <div class="filter-tabs">
      <button class="active" onclick="setFilter('all', this)">전체</button>
      <button onclick="setFilter('active', this)">진행 중</button>
      <button onclick="setFilter('done', this)">완료</button>
    </div>
    <select class="sort-select" onchange="setSort(this.value)">
      <option value="newest">최신순</option>
      <option value="oldest">오래된순</option>
      <option value="priority">우선순위순</option>
      <option value="due">마감일순</option>
    </select>
  </div>

  <div class="bulk-actions">
    <button class="btn-bulk" onclick="markAllDone()">전체 완료</button>
    <button class="btn-bulk" onclick="clearDone()" style="margin-left:auto">완료 항목 삭제</button>
    <button class="btn-bulk danger" onclick="clearAll()">전체 삭제</button>
  </div>

  <div class="todo-list" id="todo-list"></div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
  let filter = 'all';
  let sort = 'newest';

  const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };
  const PRIORITY_LABEL = { high: '높음', medium: '보통', low: '낮음' };

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  document.getElementById('today-label').textContent =
    new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  document.getElementById('new-task').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const input = document.getElementById('new-task');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }

    tasks.unshift({
      id: Date.now(),
      text,
      done: false,
      priority: document.getElementById('new-priority').value,
      due: document.getElementById('new-due').value,
      createdAt: Date.now()
    });

    input.value = '';
    document.getElementById('new-due').value = '';
    document.getElementById('new-priority').value = 'medium';
    save();
    render();
    input.focus();
  }

  function toggleDone(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }

  function markAllDone() {
    tasks.forEach(t => { t.done = true; });
    save(); render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  }

  function clearAll() {
    if (!tasks.length) return;
    if (confirm('모든 할 일을 삭제하시겠습니까?')) {
      tasks = [];
      save(); render();
    }
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function setSort(s) {
    sort = s;
    render();
  }

  function getSorted(list) {
    return [...list].sort((a, b) => {
      if (sort === 'newest') return b.createdAt - a.createdAt;
      if (sort === 'oldest') return a.createdAt - b.createdAt;
      if (sort === 'priority') return PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
      if (sort === 'due') {
        if (!a.due && !b.due) return 0;
        if (!a.due) return 1;
        if (!b.due) return -1;
        return a.due.localeCompare(b.due);
      }
      return 0;
    });
  }

  function render() {
    const td = today();
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const active = total - done;
    const overdue = tasks.filter(t => !t.done && t.due && t.due < td).length;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-done').textContent = done;
    document.getElementById('stat-overdue').textContent = overdue;

    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById('progress-bar').style.width = pct + '%';

    let visible = tasks;
    if (filter === 'active') visible = tasks.filter(t => !t.done);
    if (filter === 'done')   visible = tasks.filter(t => t.done);
    visible = getSorted(visible);

    const list = document.getElementById('todo-list');

    if (!visible.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">${filter === 'done' ? '🎉' : '📋'}</div>
          <p>${filter === 'done' ? '완료된 항목이 없습니다.' : '할 일이 없습니다. 새 항목을 추가해보세요!'}</p>
        </div>`;
      return;
    }

    list.innerHTML = visible.map(t => {
      const isOverdue = !t.done && t.due && t.due < td;
      const isToday   = !t.done && t.due && t.due === td;
      const dueLabel  = t.due
        ? (isOverdue ? `⚠️ ${formatDate(t.due)} 초과` : isToday ? `📅 오늘까지` : `📅 ${formatDate(t.due)}`)
        : '';

      return `
        <div class="todo-item ${t.done ? 'done' : ''}" id="item-${t.id}">
          <div class="checkbox-wrap">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleDone(${t.id})" />
          </div>
          <div class="todo-content">
            <div class="todo-text">${escHtml(t.text)}</div>
            <div class="todo-meta">
              <span class="priority-badge ${t.priority}">${PRIORITY_LABEL[t.priority]}</span>
              ${t.due ? `<span class="due-badge ${isOverdue ? 'overdue' : ''}">${dueLabel}</span>` : ''}
            </div>
          </div>
          <div class="todo-actions">
            <button class="btn-icon delete" onclick="deleteTask(${t.id})" title="삭제">✕</button>
          </div>
        </div>`;
    }).join('');
  }

  function formatDate(s) {
    const d = new Date(s + 'T00:00:00');
    return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
