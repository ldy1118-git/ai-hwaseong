<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>화성시 소상공인 지원사업 채팅 매칭</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d8dde6;
      --text: #18202f;
      --muted: #667085;
      --blue: #2563eb;
      --green: #16803c;
      --amber: #a16207;
      --red: #b42318;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    header {
      background: #10233f;
      color: white;
      padding: 18px 22px;
      border-bottom: 1px solid #0b1830;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 0;
    }

    header p {
      margin: 5px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
    }

    .chat-shell,
    .side-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .chat-shell {
      min-height: 720px;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    .chat-log {
      padding: 18px;
      overflow-y: auto;
      max-height: calc(100vh - 170px);
    }

    .message {
      display: flex;
      margin-bottom: 12px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(760px, 86%);
      border-radius: 8px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      background: #f8fafc;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #eaf1ff;
      border-color: #bfdbfe;
    }

    .controls {
      border-top: 1px solid var(--line);
      padding: 14px;
      background: #fbfcfe;
    }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 40px;
      border: 1px solid #c9d1dd;
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: white;
      color: #344054;
    }

    .primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      border: 1px solid #c9d1dd;
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      background: white;
      color: var(--text);
    }

    .side-panel {
      padding: 16px;
      align-self: start;
      position: sticky;
      top: 14px;
    }

    .side-panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .profile-list {
      display: grid;
      gap: 8px;
      font-size: 13px;
    }

    .profile-item {
      border-bottom: 1px solid #edf0f5;
      padding-bottom: 8px;
    }

    .profile-item strong {
      display: block;
      color: #344054;
      margin-bottom: 2px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .progress-box {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e4e7ec;
      border: 1px solid #d0d5dd;
    }

    .progress-bar {
      width: 42%;
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
      animation: progress-slide 1.1s ease-in-out infinite;
    }

    @keyframes progress-slide {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(250%);
      }
    }

    .notice-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 10px;
      background: white;
      white-space: normal;
    }

    .notice-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .notice-title {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    .notice-id {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }

    .score {
      min-width: 66px;
      text-align: center;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 6px;
      padding: 7px;
      font-weight: 800;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .ok {
      color: var(--green);
      background: #ecfdf3;
      border-color: #abefc6;
    }

    .warn {
      color: var(--amber);
      background: #fffaeb;
      border-color: #fedf89;
    }

    .bad {
      color: var(--red);
      background: #fef3f2;
      border-color: #fecdca;
    }

    .neutral {
      color: #475467;
      background: #f2f4f7;
      border-color: #d0d5dd;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .detail-box {
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .detail-box strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
    }

    ul {
      margin: 0;
      padding-left: 18px;
    }

    li {
      margin-bottom: 4px;
      color: #344054;
      font-size: 13px;
    }

    .more-wrap {
      display: flex;
      justify-content: center;
      padding-top: 10px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      .side-panel {
        position: static;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>화성시 소상공인 지원사업 채팅 매칭</h1>
    <p>matching.py가 질문 기록을 저장하고, notices 폴더를 탐색해 추천 점수를 계산합니다.</p>
  </header>

  <main>
    <section class="chat-shell">
      <div id="chatLog" class="chat-log"></div>
      <div id="controls" class="controls"></div>
    </section>

    <aside class="side-panel">
      <h2>저장된 내 조건</h2>
      <div class="muted" id="deviceLabel"></div>
      <div class="profile-list" id="profileList"></div>
    </aside>
  </main>

  <script>
    const QUESTIONS_NO_BUSINESS = [
      { key: "age", text: "만 나이를 입력해주세요.", type: "number", label: "만 나이" },
      { key: "region", text: "거주지 또는 창업 예정지가 화성시인가요?", type: "choice", choices: [["화성시", "화성시"], ["타지역", "타지역"], [null, "모름"]] },
      { key: "category", text: "관심 업종을 골라주세요.", type: "choice", choices: [["카페", "카페"], ["음식점", "음식점"], ["소매업", "소매업"], ["기타", "기타"], [null, "아직 모름"]] },
      { key: "career_experience", text: "이전에 창업한 경험이 있나요?", type: "choice", choices: [["없음", "없음"], ["있음", "있음"], [null, "모름"]] },
      { key: "asset_group", text: "소득·자산 구간을 선택해주세요.", type: "choice", choices: [["기초생활수급자", "기초생활수급자"], ["차상위", "차상위"], ["일반", "일반"], [null, "모름"]] },
      { key: "annual_revenue_krw", text: "작년 연 매출이 있으면 원 단위로 입력해주세요. 없거나 모르면 건너뛰어도 됩니다.", type: "number", label: "연 매출", optional: true },
      { key: "marital_status", text: "혼인 상태를 선택해주세요.", type: "choice", choices: [["미혼", "미혼"], ["기혼", "기혼"], [null, "모름"]] },
      { key: "living_with_parents", text: "부모님과 함께 살고 있나요?", type: "choice", choices: [[true, "예"], [false, "아니오"], [null, "모름"]] }
    ];

    const QUESTIONS_WITH_BUSINESS = [
      { key: "age", text: "사업자등록증만으로는 나이를 알 수 없어서, 만 나이를 입력해주세요.", type: "number", label: "만 나이" },
      { key: "region", text: "OCR 확인값이 없다면 사업장 소재지를 선택해주세요.", type: "choice", choices: [["화성시", "화성시"], ["타지역", "타지역"], [null, "모름"]] },
      { key: "category", text: "사업자등록증의 업종에 가까운 항목을 골라주세요.", type: "choice", choices: [["카페", "카페"], ["음식점", "음식점"], ["소매업", "소매업"], ["기타", "기타"], [null, "모름"]] },
      { key: "business_period_months", text: "사업 운영 기간은 몇 개월인가요?", type: "number", label: "운영 개월" },
      { key: "annual_revenue_krw", text: "작년 연 매출을 원 단위로 입력해주세요.", type: "number", label: "연 매출", optional: true },
      { key: "career_experience", text: "현재 사업 외에 이전 창업 경험이 있나요?", type: "choice", choices: [["없음", "없음"], ["있음", "있음"], [null, "모름"]] },
      { key: "asset_group", text: "소득·자산 구간을 선택해주세요.", type: "choice", choices: [["기초생활수급자", "기초생활수급자"], ["차상위", "차상위"], ["일반", "일반"], [null, "모름"]] },
      { key: "marital_status", text: "혼인 상태를 선택해주세요.", type: "choice", choices: [["미혼", "미혼"], ["기혼", "기혼"], [null, "모름"]] },
      { key: "living_with_parents", text: "부모님과 함께 살고 있나요?", type: "choice", choices: [[true, "예"], [false, "아니오"], [null, "모름"]] }
    ];

    const PROFILE_LABELS = {
      startup_status: "창업 유무",
      age: "만 나이",
      region: "지역",
      business_status: "사업 상태",
      category: "업종",
      career_experience: "창업 경험",
      asset_group: "소득·자산",
      business_period_months: "운영 기간",
      annual_revenue_krw: "연 매출",
      marital_status: "혼인 상태",
      living_with_parents: "부모 동거"
    };

    const OCR_FIELD_LABELS = {
      document_title: "문서명",
      tax_type: "과세 유형",
      invoice_issuer_type: "세금계산서 발급 유형",
      business_registration_number: "사업자등록번호",
      company_name: "상호",
      representative_name: "대표자명",
      birth_date: "생년월일",
      opening_date: "개업연월일",
      business_address: "사업장 소재지",
      business_type: "사업의 종류",
      business_category_main: "주 업태/업종",
      business_category_items: "종목",
      issue_reason: "발급 사유",
      joint_business: "공동사업자",
      tax_unit_applicable: "사업자단위과세 적용 여부",
      e_tax_email: "전자세금계산서 이메일",
      issue_date: "발급일",
      tax_office: "관할 세무서",
      all_ocr_lines: "OCR 전체 인식 줄"
    };

    let deviceId = localStorage.getItem("hwaseong_matching_device_id");
    if (!deviceId) {
      deviceId = `device_${crypto.randomUUID()}`;
      localStorage.setItem("hwaseong_matching_device_id", deviceId);
    }

    let profile = {};
    let chatHistory = [];
    let questionQueue = [];
    let questionIndex = 0;
    let latestResults = [];

    const chatLog = document.getElementById("chatLog");
    const controls = document.getElementById("controls");

    function addMessage(role, content) {
      const message = { role, content, created_at: new Date().toISOString() };
      chatHistory.push(message);
      renderMessage(message);
      persist();
    }

    function renderMessage(message) {
      const row = document.createElement("div");
      row.className = `message ${message.role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = message.content;
      row.appendChild(bubble);
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function setControls(html) {
      controls.innerHTML = html;
    }

    function setProgress(message) {
      setControls(`
        <div class="progress-box">
          <div>${message}</div>
          <div class="progress-track"><div class="progress-bar"></div></div>
        </div>
      `);
    }

    async function postJSON(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "요청 실패");
      return payload;
    }

    async function persist() {
      await postJSON("/api/user/save", {
        device_id: deviceId,
        profile,
        chat_history: chatHistory
      }).catch(() => {});
      renderProfile();
    }

    function valueText(value) {
      if (value === null || value === undefined || value === "") return "모름";
      if (value === true) return "예";
      if (value === false) return "아니오";
      if (typeof value === "number") return value.toLocaleString("ko-KR");
      return String(value);
    }

    function formatOcrFieldValue(value) {
      if (Array.isArray(value)) {
        return value.map((line) => `&nbsp;&nbsp;${line}`).join("<br>");
      }
      return valueText(value);
    }

    function renderOcrFields(fields) {
      return Object.entries(fields)
        .map(([key, value]) => `- ${OCR_FIELD_LABELS[key] || key}: ${formatOcrFieldValue(value)}`)
        .join("<br>");
    }

    function renderProfile() {
      document.getElementById("deviceLabel").textContent = `장치번호: ${deviceId}`;
      const list = document.getElementById("profileList");
      const entries = Object.entries(PROFILE_LABELS)
        .filter(([key]) => profile[key] !== undefined && profile[key] !== null && profile[key] !== "");
      if (!entries.length) {
        list.innerHTML = `<div class="muted">아직 저장된 조건이 없습니다.</div>`;
        return;
      }
      list.innerHTML = entries.map(([key, label]) => `
        <div class="profile-item">
          <strong>${label}</strong>
          <span>${valueText(profile[key])}</span>
        </div>
      `).join("");
    }

    function hasKnownProfileValue(key) {
      return profile[key] !== undefined && profile[key] !== null && profile[key] !== "";
    }

    function startIntro() {
      addMessage("bot", "안녕하세요. 지원사업 매칭을 위해 먼저 창업 여부부터 확인할게요.");
      askStartupStatus();
    }

    function askStartupStatus() {
      addMessage("bot", "창업을 한 적이 있나요?");
      setControls(`
        <div class="choice-row">
          <button type="button" data-value="none">아직 창업한 적 없음</button>
          <button type="button" data-value="registered">사업자등록증 있음</button>
        </div>
      `);
      controls.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => handleStartupStatus(button.dataset.value));
      });
    }

    function handleStartupStatus(value) {
      if (value === "none") {
        profile.startup_status = "창업한 적 없음";
        profile.business_status = "예비창업자";
        profile.business_period_months = 0;
        addMessage("user", "아직 창업한 적 없음");
        questionQueue = QUESTIONS_NO_BUSINESS;
        questionIndex = 0;
        askNextQuestion();
        return;
      }

      profile.startup_status = "사업자등록증 있음";
      profile.business_status = "운영중";
      addMessage("user", "사업자등록증 있음");
      askBusinessRegistrationUpload();
    }

    function askBusinessRegistrationUpload() {
      addMessage("bot", "사업자등록증 사진을 올려주세요. 지금은 OCR 연결 전이라 파일을 저장하고, 부족한 정보는 이어서 질문할게요.");
      setControls(`
        <div class="input-row">
          <input id="businessFile" type="file" accept="image/*,.pdf">
          <button class="primary" type="button" id="uploadButton">업로드</button>
        </div>
        <div class="choice-row" style="margin-top:8px">
          <button type="button" id="skipUpload">업로드 건너뛰기</button>
        </div>
      `);
      document.getElementById("uploadButton").addEventListener("click", uploadBusinessRegistration);
      document.getElementById("skipUpload").addEventListener("click", () => {
        addMessage("user", "사업자등록증 업로드 건너뛰기");
        continueBusinessQuestions();
      });
    }

    function uploadBusinessRegistration() {
      const file = document.getElementById("businessFile").files[0];
      if (!file) {
        addMessage("bot", "파일을 선택해주세요.");
        return;
      }
      const reader = new FileReader();
      reader.onload = async () => {
        addMessage("user", `${file.name} 업로드`);
        setProgress("사업자등록증을 저장하고 OCR을 준비하는 중입니다. 첫 실행이면 모델 로딩 때문에 시간이 걸릴 수 있어요.");
        try {
          const upload = await postJSON("/api/business-registration", {
            device_id: deviceId,
            filename: file.name,
            data_url: reader.result
          });
          if (upload.extracted_profile && Object.keys(upload.extracted_profile).length) {
            profile = { ...profile, ...upload.extracted_profile };
            renderProfile();
          }
          const extractedFields = upload.extracted_fields && Object.keys(upload.extracted_fields).length
            ? `<br><br>추출된 값:<br>${renderOcrFields(upload.extracted_fields)}`
            : "";
          addMessage("bot", `${upload.ocr_message}${extractedFields}`);
        } catch (error) {
          addMessage("bot", `업로드 실패: ${error.message}`);
        }
        continueBusinessQuestions();
      };
      reader.readAsDataURL(file);
    }

    function continueBusinessQuestions() {
      const knownQuestions = QUESTIONS_WITH_BUSINESS.filter((question) => hasKnownProfileValue(question.key));
      if (knownQuestions.length) {
        const knownLabels = knownQuestions.map((question) => PROFILE_LABELS[question.key] || question.key).join(", ");
        addMessage("bot", `OCR로 ${knownLabels} 정보를 확인했어요. 부족한 정보만 이어서 물어볼게요.`);
      }
      questionQueue = QUESTIONS_WITH_BUSINESS.filter((question) => !hasKnownProfileValue(question.key));
      questionIndex = 0;
      askNextQuestion();
    }

    function askNextQuestion() {
      persist();
      if (questionIndex >= questionQueue.length) {
        showMatch();
        return;
      }

      const question = questionQueue[questionIndex];
      addMessage("bot", question.text);
      if (question.type === "choice") {
        setControls(`
          <div class="choice-row">
            ${question.choices.map(([value, label], index) => `<button type="button" data-index="${index}">${label}</button>`).join("")}
          </div>
        `);
        controls.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => answerQuestion(question, question.choices[Number(button.dataset.index)][0], question.choices[Number(button.dataset.index)][1]));
        });
        return;
      }

      setControls(`
        <div class="input-row">
          <input id="answerInput" type="${question.type}" placeholder="${question.label || ""}">
          <button class="primary" type="button" id="answerButton">입력</button>
        </div>
        ${question.optional ? `<div class="choice-row" style="margin-top:8px"><button type="button" id="skipButton">건너뛰기</button></div>` : ""}
      `);
      document.getElementById("answerButton").addEventListener("click", () => {
        const input = document.getElementById("answerInput");
        const raw = input.value.trim();
        if (!raw && !question.optional) {
          addMessage("bot", "값을 입력하거나 모름/건너뛰기를 선택해주세요.");
          return;
        }
        const value = raw ? Number(raw) : null;
        answerQuestion(question, Number.isNaN(value) ? null : value, raw || "모름");
      });
      const skip = document.getElementById("skipButton");
      if (skip) {
        skip.addEventListener("click", () => answerQuestion(question, null, "모름"));
      }
    }

    function answerQuestion(question, value, label) {
      profile[question.key] = value;
      addMessage("user", label);
      questionIndex += 1;
      askNextQuestion();
    }

    async function showMatch() {
      addMessage("bot", "입력한 조건을 저장했습니다. matching.py가 notices 폴더를 탐색해서 추천 공고를 계산할게요.");
      setProgress("추천 결과를 계산하는 중입니다.");
      try {
        const payload = await postJSON("/api/match", {
          device_id: deviceId,
          user_profile: profile
        });
        latestResults = payload.results;
        addMessage("bot", renderResults(false));
        if (latestResults.length > 3) {
          setControls(`<button class="primary" type="button" id="moreButton">나머지 ${latestResults.length - 3}개 더보기</button><button type="button" id="restartButton">다시 입력하기</button>`);
          document.getElementById("moreButton").addEventListener("click", () => {
            addMessage("bot", renderResults(true));
            setRestartControl();
          });
          document.getElementById("restartButton").addEventListener("click", restart);
        } else {
          setRestartControl();
        }
      } catch (error) {
        addMessage("bot", `추천 계산 실패: ${error.message}`);
        setRestartControl();
      }
    }

    function badgeClass(value) {
      if (["신청가능", "접수중", "충족"].includes(value)) return "ok";
      if (["조건부", "확인필요", "접수예정", "기간미상"].includes(value)) return "warn";
      if (["대상아님", "지원기간종료", "불충족"].includes(value)) return "bad";
      return "neutral";
    }

    function listItems(items) {
      if (!items.length) return "<ul><li>없음</li></ul>";
      return `<ul>${items.map((item) => `<li>${item.detail || item}</li>`).join("")}</ul>`;
    }

    function renderCard(result, index) {
      const satisfied = result.condition_results.filter((item) => item.status === "충족");
      const needsCheck = result.condition_results.filter((item) => item.status === "확인필요");
      const notSatisfied = result.condition_results.filter((item) => item.status === "불충족");
      const documents = result.expected_documents.map((doc) => `${doc.name} (${doc.required_type}, ${doc.confidence === "confirmed" ? "확정" : "추정"})`);
      const closedNotice = result.application_status === "지원기간종료" && result.overall_status !== "대상아님"
        ? `<span class="badge warn">마감됐지만 조건상 가능성이 있었던 공고</span>`
        : "";
      const link = result.source_url ? `<a href="${result.source_url}" target="_blank" rel="noreferrer">원문 보기</a>` : "";

      return `
        <article class="notice-card">
          <div class="notice-head">
            <div>
              <h3 class="notice-title">${index}. ${result.notice_title || result.notice_id}</h3>
              <div class="notice-id">${result.notice_id} ${link}</div>
            </div>
            <div class="score">${result.match_score}점</div>
          </div>
          <div class="meta">
            <span class="badge ${badgeClass(result.overall_status)}">${result.overall_status}</span>
            <span class="badge ${badgeClass(result.application_status)}">${result.application_status}</span>
            <span class="badge neutral">${result.application_detail}</span>
            ${closedNotice}
          </div>
          <div class="detail-grid">
            <div class="detail-box"><strong>맞는 조건</strong>${listItems(satisfied)}</div>
            <div class="detail-box"><strong>확인/불충족</strong>${listItems([...needsCheck, ...notSatisfied])}</div>
            <div class="detail-box"><strong>예상 서류</strong>${listItems(documents)}</div>
          </div>
        </article>
      `;
    }

    function renderResults(showAll) {
      const visible = showAll ? latestResults : latestResults.slice(0, 3);
      const possibleCount = latestResults.filter((result) => result.overall_status !== "대상아님").length;
      const activeCount = latestResults.filter((result) => result.application_status === "접수중" && result.overall_status !== "대상아님").length;
      const closedMatchCount = latestResults.filter((result) => result.application_status === "지원기간종료" && result.overall_status !== "대상아님").length;
      return `
        <div class="meta">
          <span class="badge ok">현재 추천 ${activeCount}개</span>
          <span class="badge warn">조건상 가능 ${possibleCount}개</span>
          <span class="badge neutral">마감 추천 ${closedMatchCount}개</span>
        </div>
        ${visible.map((result, index) => renderCard(result, index + 1)).join("")}
      `;
    }

    function setRestartControl() {
      setControls(`<button class="primary" type="button" id="restartButton">처음부터 다시 입력</button><button type="button" id="matchAgainButton">현재 조건으로 다시 추천</button>`);
      document.getElementById("restartButton").addEventListener("click", restart);
      document.getElementById("matchAgainButton").addEventListener("click", showMatch);
    }

    function restart() {
      profile = {};
      questionQueue = [];
      questionIndex = 0;
      addMessage("bot", "좋아요. 처음부터 다시 확인할게요.");
      askStartupStatus();
      renderProfile();
    }

    async function boot() {
      document.getElementById("deviceLabel").textContent = `장치번호: ${deviceId}`;
      try {
        const record = await postJSON("/api/user/load", { device_id: deviceId });
        profile = record.profile || {};
        chatHistory = record.chat_history || [];
        chatLog.innerHTML = "";
        chatHistory.forEach(renderMessage);
        renderProfile();

        if (Object.keys(profile).length) {
          addMessage("bot", "이 장치에 저장된 이전 조건을 불러왔어요. 그대로 추천을 볼 수도 있고, 새로 입력할 수도 있어요.");
          setControls(`<button class="primary" type="button" id="savedMatch">저장된 조건으로 추천</button><button type="button" id="newStart">새로 입력</button>`);
          document.getElementById("savedMatch").addEventListener("click", showMatch);
          document.getElementById("newStart").addEventListener("click", restart);
        } else {
          startIntro();
        }
      } catch (error) {
        addMessage("bot", `서버 연결 실패: ${error.message}`);
        setControls(`<span class="muted">test.bat으로 matching.py 서버를 실행해주세요.</span>`);
      }
    }

    boot();
  </script>
</body>
</html>
