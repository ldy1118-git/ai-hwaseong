name: 공고 자동 갱신

# 공고에는 마감일이 있다. 며칠만 지나도 이미 끝난 사업이 화면에 남고,
# 새로 뜬 사업은 빠진다. 받아와서 바뀐 게 있을 때만 커밋한다.
#
# 커밋이 생기면 Vercel 이 알아서 재배포한다.

# 매일 돌리는 일정은 껐다. 기업마당 API 가 GitHub 러너의 IP 에 응답하지
# 않는다. 2026-08-20, 08-21 이틀 연속 「공고 수집」 에서 죽었고, 같은
# 스크립트를 국내 서버에서 돌리면 1,607건이 정상으로 들어온다.
#
# 이제 수집은 연구실 서버의 cron 이 맡는다 (scripts/cron_update_notices.sh).
# 여기는 손으로 돌릴 때만 쓴다. 국내 IP 문제가 풀리면 아래 schedule 을
# 다시 살리면 된다.
on:
  # schedule:
  #   - cron: '11 21 * * *'      # 매일 06:11 KST
  workflow_dispatch:      # Actions 탭에서 손으로 돌린다

permissions:
  contents: write

# 앞 실행이 안 끝났는데 또 도는 걸 막는다. 같은 파일을 두 번 고치면 충돌난다.
concurrency:
  group: update-notices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # pip install 이 없다. 수집 파이프라인은 표준 라이브러리만 쓴다.

      # fetch_docs.py 가 첨부 PDF 를 pdftotext 로 읽는다. 러너에 기본으로
      # 깔려 있지 않다. 이게 없으면 공고문을 하나도 못 읽어서, 서류가
      # 기본값 2개로 덮이고 자격요건도 사라진다. 실제로 그렇게 한 번 깎였다.
      - name: pdftotext 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 공고 수집·추출·검사
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: ./scripts/update_notices.sh

      # 파이프라인이 "성공"으로 끝나도 데이터가 깎일 수 있다. 오류가 안 나기
      # 때문이다. 건수만 세지 말고 내용이 얼마나 남았는지를 본다.
      - name: 데이터가 줄지 않았는지 확인
        run: python3 policy_data/guard.py

      - name: 바뀐 게 있으면 커밋
        run: |
          # git diff 가 아니라 git status 로 본다. diff 는 새로 생긴 파일을
          # 못 봐서, 새 공고만 뜨고 기존 공고는 그대로인 날에 「바뀐 것 없음」
          # 으로 판단하고 새 공고를 통째로 놓친다.
          changed=$(git status --porcelain -- policy_data/notices | wc -l)
          if [ "$changed" -eq 0 ]; then
            echo "바뀐 공고 없음. 커밋하지 않는다."
            exit 0
          fi

          echo "── 바뀐 내용"
          git status --short -- policy_data/notices

          # 커밋 이메일이 GitHub 계정과 안 맞으면 Vercel 이 배포를 거부한다.
          # github-actions[bot] 은 GitHub 이 인정하는 계정이라 통과한다.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 기준선도 같이 갱신한다. 공고가 늘면 서류·조건 총량도 늘어서,
          # 안 하면 다음 실행 때 기준이 낡은 채로 남는다.
          python3 policy_data/guard.py --save

          git add policy_data/notices policy_data/baseline.json
          git commit -m "공고 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))

          기업마당 API 에서 받아 파일 ${changed}개가 바뀌었다.
          .github/workflows/update-notices.yml 이 매일 06:00(KST)에 돌린다."
          git push
